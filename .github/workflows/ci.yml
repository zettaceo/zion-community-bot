name: ZION CI

on:
  push:
    branches:
      - main
      - dev
      - zion-v1
      - zion-v1.1-dev
      - "audit/**"
  pull_request:

permissions:
  contents: read

concurrency:
  # Push and pull_request are separate event streams. Keeping them in
  # distinct groups prevents a stale push run from blocking PR validation.
  group: zion-ci-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: >-
          python -m pip --isolated install
          --disable-pip-version-check
          --no-input
          --no-deps
          --require-hashes
          --only-binary=:all:
          --index-url https://pypi.org/simple
          -r requirements.lock

      - name: Validate
        run: ZION_VALIDATION_PYTHON="$pythonLocation/bin/python" bash scripts/validate.sh
