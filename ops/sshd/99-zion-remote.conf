# ZION OpenSSH hardening
#
# Apply only after:
# 1. Tailscale connectivity is proven;
# 2. the operator public key is present in ~/.ssh/authorized_keys;
# 3. a public-key SSH login has succeeded;
# 4. the server host-key fingerprint was verified out of band.
#
# Network exposure is a separate control. This file does not open or
# close firewall/router ports.

PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

AllowUsers zetta

AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no
GatewayPorts no
PermitTunnel no
PermitUserEnvironment no

MaxAuthTries 3
LoginGraceTime 30
